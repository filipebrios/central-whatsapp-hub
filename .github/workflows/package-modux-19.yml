name: MODUX - pacote consolidado

on:
  push:
    branches:
      - feature/modux-1.9-consolidated
    paths:
      - "modux-agenda/RELEASE-1.9.0.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/validate-modux-19.yml
  package:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Conferir intenção de pacote único
        shell: pwsh
        run: |
          $release = Get-Content modux-agenda/RELEASE-1.9.0.json -Raw | ConvertFrom-Json
          if ($release.version -notmatch '^1\.\d+\.\d+$' -or $release.tag -ne "modux-v$($release.version)-beta1") { throw "Manifesto de release inválido" }
          if ($release.notes -notmatch '^modux-agenda/RELEASE-[0-9.]+\.md$') { throw "Notas de release inválidas" }
          "MODUX_VERSION=$($release.version)" >> $env:GITHUB_ENV
          "MODUX_TAG=$($release.tag)" >> $env:GITHUB_ENV
          "MODUX_NOTES=$($release.notes)" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Aplicar integração e versão consolidada
        run: python modux-agenda/apply_sidebar.py
      - name: Compilar pacote Windows autocontido
        run: dotnet publish webview2-prototype/CentralWhatsApp.WebView2.csproj -c Release -r win-x64 --self-contained true -o webview2-prototype/publish
      - name: Conferir versão e preservação dos perfis
        shell: pwsh
        run: |
          $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "webview2-prototype/publish/MODUX.exe")).ProductVersion
          if (-not $version.StartsWith($env:MODUX_VERSION)) { throw "Versão incorreta: $version" }
          $company = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "webview2-prototype/publish/MODUX.exe")).CompanyName
          if ($company -ne "ARANY") { throw "Crédito do executável incorreto" }
          $forbidden = Get-ChildItem webview2-prototype/publish -Recurse | Where-Object { $_.Name -match '^(accounts\.json|preferences\.json|profiles|Cookies|Login Data|google-oauth.*|client_secret.*|\.env)$' }
          if ($forbidden) { throw "Pacote contém configuração ou perfil local: $($forbidden.Name -join ', ')" }
          $script = Get-Content webview2-prototype/CentralWhatsApp.iss -Raw
          if ($script -match '\[UninstallDelete\]' -or $script -match 'Type: filesandordirs') { throw "Revisar remoção de dados no instalador" }
      - name: Preparar Inno Setup
        shell: pwsh
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $compiler)) { throw "Inno Setup indisponível" }
      - name: Conferir página pública antes de gerar instalador
        shell: pwsh
        run: |
          $ready = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            try {
              $page = Invoke-WebRequest "https://sbento.com.br/modux-resposta.html" -TimeoutSec 15
              if ($page.StatusCode -eq 200 -and $page.Content.Contains('id="confirmation"') -and $page.Content.Contains('modux-resposta.mjs')) { $ready = $true; break }
            } catch { Write-Host "Página pública ainda não disponível; aguardando publicação validada." }
            Start-Sleep -Seconds 10
          }
          if (-not $ready) { throw "Página de respostas ainda não foi publicada; instalador não será gerado." }
      - name: Gerar o instalador consolidado
        shell: pwsh
        working-directory: webview2-prototype
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "CentralWhatsApp.iss"'
      - name: Testar instalação e preservação de dados fictícios
        shell: pwsh
        run: |
          $profiles = Join-Path $env:LOCALAPPDATA "CentralWhatsApp\WebView2Prototype"
          New-Item -ItemType Directory -Force $profiles | Out-Null
          $sentinel = Join-Path $profiles "modux-ci-sentinel.txt"
          Set-Content $sentinel "fixture de preservação"
          $fixtureHash = (Get-FileHash $sentinel -Algorithm SHA256).Hash
          $accountFixture = Join-Path $profiles "accounts.json"
          '[{"Id":"waseller-account","Name":"Atendimento de teste"},{"Id":"account-fixture","Name":"Pessoal de teste"}]' | Set-Content $accountFixture
          $accountsHash = (Get-FileHash $accountFixture -Algorithm SHA256).Hash
          $destination = Join-Path $env:RUNNER_TEMP "modux-install-test"
          $setup = Resolve-Path "webview2-prototype/installer-output/MODUX-Setup-$env:MODUX_VERSION.exe"
          $process = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", '/TASKS=""', "/DIR=`"$destination`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Instalação falhou: $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $destination "MODUX.exe")) -or -not (Test-Path $sentinel)) { throw "Instalação ou perfil não preservado" }
          if ((Get-FileHash $accountFixture -Algorithm SHA256).Hash -ne $accountsHash) { throw "Instalação alterou as contas" }
          $uninstall = Join-Path $destination "unins000.exe"
          $process = Start-Process $uninstall -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path $sentinel)) { throw "Desinstalação afetou dados do perfil" }
          if ((Get-FileHash $sentinel -Algorithm SHA256).Hash -ne $fixtureHash) { throw "Conteúdo do perfil foi alterado" }
          if ((Get-FileHash $accountFixture -Algorithm SHA256).Hash -ne $accountsHash) { throw "Desinstalação alterou as contas" }
      - name: Calcular SHA-256
        shell: pwsh
        run: |
          $asset = "webview2-prototype/installer-output/MODUX-Setup-$env:MODUX_VERSION.exe"
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "$hash  MODUX-Setup-$env:MODUX_VERSION.exe" | Set-Content webview2-prototype/installer-output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MODUX-Setup-consolidado
          path: webview2-prototype/installer-output/
          if-no-files-found: error
          retention-days: 14
      - name: Preparar release em rascunho para conferência final
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:MODUX_TAG
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { throw "A release já existe e será preservada. Confira o artefato desta execução." }
          gh release create $tag "webview2-prototype/installer-output/MODUX-Setup-$env:MODUX_VERSION.exe" webview2-prototype/installer-output/SHA256SUMS.txt --target ${{ github.sha }} --title "MODUX $env:MODUX_VERSION beta • Windows x64 • ARANY" --notes-file $env:MODUX_NOTES --prerelease --draft
      - name: Conferir assets publicados e liberar beta consolidada
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:MODUX_TAG
          $release = gh release view $tag --json isDraft,assets | ConvertFrom-Json
          if (-not $release.isDraft -or $release.assets.Count -ne 2) { throw "Conferir estado/assets antes de publicar" }
          gh release download $tag --dir release-check --pattern "MODUX-Setup-$env:MODUX_VERSION.exe" --pattern "SHA256SUMS.txt"
          if ($LASTEXITCODE -ne 0) { throw "Download de conferência falhou" }
          $expected = (Get-Content release-check/SHA256SUMS.txt -Raw).Split(" ")[0].Trim()
          $actual = (Get-FileHash "release-check/MODUX-Setup-$env:MODUX_VERSION.exe" -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "SHA-256 do asset não confere" }
          gh release edit $tag --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível publicar a beta" }
