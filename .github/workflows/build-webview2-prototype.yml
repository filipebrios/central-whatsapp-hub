name: Build MODUX installer

on:
  push:
    branches:
      - codex/electron-windows-mvp
      - feature/criatta-modux-bridge
    paths:
      - "webview2-prototype/**"
      - "tests/ComposeRequest/**"
      - ".github/workflows/build-webview2-prototype.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Verify compose protocol
        run: dotnet run --project tests/ComposeRequest/ComposeRequest.csproj

      - name: Publish MODUX
        shell: pwsh
        run: dotnet publish webview2-prototype/CentralWhatsApp.WebView2.csproj -c Release -r win-x64 --self-contained true -o webview2-prototype/publish

      - name: Locate Inno Setup
        id: inno
        shell: pwsh
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found."
          }
          "compiler=$compiler" >> $env:GITHUB_OUTPUT

      - name: Build automatic installer
        shell: pwsh
        working-directory: webview2-prototype
        run: '& "${{ steps.inno.outputs.compiler }}" "CentralWhatsApp.iss"'

      - name: Publish direct installer download
        if: github.ref == 'refs/heads/codex/electron-windows-mvp'
        shell: pwsh
        working-directory: webview2-prototype
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "modux-v1.6.0"
          $installer = "installer-output/MODUX-Setup-1.6.0.exe"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $installer --title "MODUX 1.6.0" --notes "Integração com Criatta: abre rascunhos pelo protocolo modux, permite revisar destinatário e escolher conta antes de abrir a conversa. Envio manual no WhatsApp." --prerelease --target ${{ github.sha }}
          } else {
            Write-Host "Release existente preservada; instalador deste build disponível nos artifacts."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MODUX-Setup-1.6.0
          path: webview2-prototype/installer-output/MODUX-Setup-1.6.0.exe
          if-no-files-found: error

