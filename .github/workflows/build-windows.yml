name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - codex/electron-windows-mvp

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build renderer and installer
        run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Central-WhatsApp-Windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
